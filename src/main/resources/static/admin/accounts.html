<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin accounts | BookNest Admin</title>
    <link rel="stylesheet" href="vendor/bootstrap.min.css">
    <link rel="stylesheet" href="admin.css">
    <script src="accounts.js" defer></script>
</head>
<body>
<a class="visually-hidden-focusable skip-link" href="#main-content">Skip to content</a>
<div class="admin-layout">
    <aside class="admin-sidebar">
        <a class="brand" href="dashboard.html">
            <span class="brand-mark" aria-hidden="true">B</span>
            <span>BookNest <small>Administration</small></span>
        </a>
        <nav class="nav admin-nav" aria-label="Admin navigation">
            <a class="nav-link" href="dashboard.html">Dashboard</a>
            <a class="nav-link active" aria-current="page" href="accounts.html">Admin accounts</a>
            <a class="nav-link" href="activity.html">Activity logs</a>
        </nav>
    </aside>
    <header class="admin-topbar">
        <a class="btn btn-outline-secondary btn-sm" href="/logout">Sign out</a>
    </header>
    <main class="admin-main" id="main-content">
        <div class="page-heading">
            <div>
                <h1>Admin accounts</h1>
                <p>Create accounts and manage administrator roles.</p>
            </div>
            <button id="add-admin" class="btn btn-primary" type="button" disabled>Add admin</button>
        </div>
        <div class="card table-card">
            <div class="table-responsive" role="region" aria-label="Admin accounts" tabindex="0">
                <table class="table table-hover align-middle accounts-table" aria-label="Admin accounts">
                    <thead>
                    <tr>
                        <th scope="col">Username</th>
                        <th scope="col">Email</th>
                        <th scope="col">Role</th>
                        <th scope="col">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="account-rows"></tbody>
                </table>
            </div>
            <p class="table-status" id="status" role="status" aria-live="polite">Loading accounts…</p>
        </div>
    </main>
</div>

<dialog id="account-dialog" class="admin-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title">Add admin</h2>
    <form id="account-form">
        <label class="form-label">Username
            <input class="form-control" name="username" autocomplete="off" required>
        </label>
        <label class="form-label">Email
            <input class="form-control" name="email" type="email" required>
        </label>
        <label class="form-label" id="password-field">Password
            <input class="form-control" name="password" type="password" autocomplete="new-password">
        </label>
        <label class="form-label">Role
            <select class="form-select" name="adminLevel">
                <option value="ADMIN">Admin</option>
                <option value="SUPER_ADMIN">Super admin</option>
            </select>
        </label>
        <p id="form-error" class="alert alert-danger" role="alert" hidden></p>
        <div class="dialog-actions">
            <button id="cancel-edit" class="btn btn-outline-secondary" type="button">Cancel</button>
            <button id="save-admin" class="btn btn-primary" type="submit">Save</button>
        </div>
    </form>
</dialog>

<dialog id="delete-dialog" class="admin-dialog" aria-labelledby="delete-title"
        aria-describedby="delete-message">
    <h2 id="delete-title">Delete admin account?</h2>
    <p id="delete-message"></p>
    <form method="dialog" class="dialog-actions">
        <button class="btn btn-outline-secondary" value="cancel" autofocus>Cancel</button>
        <button class="btn btn-danger" value="delete">Delete account</button>
    </form>
</dialog>
</body>
</html>
