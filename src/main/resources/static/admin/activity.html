<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activity logs | BookNest Admin</title>
    <link rel="stylesheet" href="/css/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="/css/admin.css">
    <script src="activity.js" defer></script>
</head>
<body>
<a class="visually-hidden-focusable skip-link" href="#main-content">Skip to content</a>
<div class="admin-wrapper">
    <aside class="sidebar">
        <div class="brand">
            <h2>BookNest</h2>
            <span>Administration</span>
        </div>
        <nav aria-label="Admin navigation">
            <a href="/admin.html#dashboard">Dashboard</a>
            <a href="/admin.html#books">Manage Books</a>
            <a href="/admin.html#add-book">Add New Book</a>
            <a href="/admin.html#inventory">Inventory</a>
            <a href="/admin/accounts.html">Admin Accounts</a>
            <a href="/admin/activity.html" class="active" aria-current="page">Activity Logs</a>
        </nav>
        <div class="sidebar-bottom">
            <a href="/">Visit Store</a>
        </div>
    </aside>
    <main class="main-content" id="main-content">
        <header class="topbar">
            <div>
                <h1>Activity Logs</h1>
                <p>Review account changes and see who made them.</p>
            </div>
            <div class="admin-profile">
                <span>Super admin</span>
                <a class="btn btn-sm admin-secondary-button" href="/logout">Sign out</a>
                <div class="profile-icon" aria-hidden="true">A</div>
            </div>
        </header>
        <div class="section-heading">
            <button id="refresh-activity" class="btn admin-secondary-button" type="button">Refresh</button>
        </div>
        <div class="table-container admin-data-table">
            <div class="table-responsive" role="region" aria-label="Admin account activity" tabindex="0">
                <table class="table table-hover align-middle activity-table" aria-label="Admin account activity">
                    <thead>
                    <tr>
                        <th scope="col">Date and time</th>
                        <th scope="col">Action</th>
                        <th scope="col">Performed by</th>
                        <th scope="col">Account ID</th>
                    </tr>
                    </thead>
                    <tbody id="activity-rows"></tbody>
                </table>
            </div>
            <p class="table-status" id="activity-status" role="status" aria-live="polite">Loading activity…</p>
        </div>
    </main>
</div>
</body>
</html>
