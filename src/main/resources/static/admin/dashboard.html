<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin dashboard | BookNest</title>
    <style>
        :root {
            font-family: Inter, system-ui, sans-serif;
            color: #172525;
            background: #f5f7f6;
            color-scheme: light;
        }

        body { margin: 0; }
        header { background: #153633; color: white; }
        header div, main { max-width: 65rem; margin: auto; padding: 1rem 1.5rem; }
        header div { display: flex; justify-content: space-between; align-items: center; }
        header a { color: white; }
        main { padding-top: 2.5rem; }
        h1 { margin: 0 0 1.5rem; font-size: clamp(1.8rem, 4vw, 2.5rem); }
        h2 { margin: 0; font-size: 1.25rem; }
        .feature {
            max-width: 31rem;
            padding: 1.5rem;
            border: 1px solid #d9e3df;
            border-radius: .75rem;
            background: white;
        }
        .feature p { margin: .5rem 0 1rem; line-height: 1.5; }
        .feature a {
            display: inline-block;
            padding: .6rem .9rem;
            border-radius: .4rem;
            background: #17634f;
            color: white;
            text-decoration: none;
        }
        .feature a:hover { background: #114a3c; }
    </style>
</head>
<body>
<header>
    <div>
        <strong>BookNest</strong>
        <a href="/logout">Sign out</a>
    </div>
</header>
<main>
    <h1>Admin dashboard</h1>
    <section class="feature" aria-labelledby="accounts-heading">
        <h2 id="accounts-heading">Admin accounts</h2>
        <p>Super admins can add, edit, and remove admin accounts.</p>
        <a href="accounts.html">Manage admin accounts</a>
    </section>
</main>
</body>
</html>
